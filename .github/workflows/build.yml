name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ci/Dockerfile
          load: true
          tags: ci-image:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Pico Firmware
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e PICO_SDK_PATH=/workspace/third_party/pico-sdk \
            ci-image:latest \
            bash -c '
              /usr/bin/python3 \
              tools/scripts/generate_config_header.py || \
              (echo "Config generation failed!" && exit 1)
              cmake -S . -B build-pico -DBUILD_PICO=ON
              cmake --build build-pico --parallel $(nproc)
            '